# Publica la app de Líderes del Mañana (carpeta ldm/app) en GitHub Pages
# cada vez que hay cambios en esa carpeta en la rama main.
name: Publicar app LDM

on:
  push:
    branches: [main]
    paths: ['ldm/app/**', '.github/workflows/ldm-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ldm/app
      - id: deploy
        uses: actions/deploy-pages@v4
